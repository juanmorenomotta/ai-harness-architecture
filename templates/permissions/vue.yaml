# templates/permissions/vue.yaml
# ---------------------------------------------------------------------------
# FRAGMENTO DE REFERENCIA — stack Vue 3 + Vite (JS). NO es una politica
# completa y NO se copia a ningun componente (ADR-022: los componentes no
# llevan agentes ni politicas; la UNICA politica vive en el harness).
#
# Uso: cuando se instancia un componente Vue, un PR HUMANO agrega estas
# rutas a `.agents/policies/permissions.yaml` del harness, sustituyendo
# `<componente>` por la carpeta del componente en el workspace
# (ej. `frontend`).
#
# Notas:
#   - package.json, package-lock.json y vite.config.js quedan FUERA a
#     proposito: escribirlos requiere una PR humana aparte.
#   - Si los tests viven co-localizados bajo `src/**/__tests__/`, la ruta
#     `tests/**` sobra: mantener una de las dos, no ambas.
# ---------------------------------------------------------------------------

stack: vue

# Rutas a agregar en roles.sdd-developer.writable_paths:
sdd-developer-writable:
  - "<componente>/src/**"
  - "<componente>/public/**"
  - "<componente>/tests/**"

# Rutas a agregar en roles.sdd-init.writable_paths:
sdd-init-writable:
  - "<componente>/.spec/**/scope.md"

# Rutas a agregar en roles.sdd-tech-lead.writable_paths:
sdd-tech-lead-writable:
  - "<componente>/.spec/**/design.md"
  - "<componente>/.spec/**/tasks/**"
  - "<componente>/.spec/**/ADR/**"

# Rutas a agregar en roles.sdd-verifier.writable_paths:
sdd-verifier-writable:
  - "<componente>/.spec/**/verify.md"

# Gate del componente (init.sh), rama sugerida para este stack:
gate-hints:
  lint: "npm run lint"
  format: "npm run format:check"
  typecheck: "npx --no-install vue-tsc --noEmit"
  tests: "npm test"
