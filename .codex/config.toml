[model]
# Codex ejecuta un modelo por sesión; la asignación por rol se resuelve
# pasando --model en cada invocación desde el orquestador.
default = "DeepSeek V4 Flash (deepseek)"
reasoning_effort = "high"

[agents]
harness-maintainer = { model = "gpt-5.3-codex", reasoning = "medium" }
sdd-developer = { model = "gpt-5.3-codex", reasoning = "medium" }
sdd-init = { model = "claude-sonnet-5", reasoning = "high" }
sdd-security-reviewer = { model = "claude-sonnet-5", reasoning = "high" }
sdd-tech-lead = { model = "gpt-5.6-terra", reasoning = "high" }
sdd-verifier = { model = "DeepSeek V4 Flash (deepseek)", reasoning = "high" }

[safety]
# R3/R4 del AGENTS.md raíz
auto_merge = false
allow_protected_file_edits = false