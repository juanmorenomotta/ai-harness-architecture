# .harness/models.yaml
# ---------------------------------------------------------------------------
# ÚNICO PUNTO DE VERDAD de asignación de modelos.
# Los prompts en .agents/agents/*.md NUNCA mencionan un modelo (Regla de capas).
# Cambiar de modelo = editar este archivo + `bash scripts/sync-adapters.sh`.
#
# `model` admite:
#   - un nombre de modelo del catálogo del proveedor (ver .harness/providers.yaml)
#   - un alias nativo del CLI (ver .harness/routing.yaml -> aliases)
#   - un modelo local servido por endpoint OpenAI-compatible (provider: "local")
#
# VALIDACIÓN (2026-09-15, contra documentación oficial de cada proveedor):
#   ✔ deepseek-flash        API DeepSeek — nombre vigente. V4.1-Flash, 1M ctx, tools, vision.
#   ✔ deepseek-v4-pro       API DeepSeek — V4-Pro-0813, 1M ctx, tools, sin vision.
#   ✔ claude-sonnet-5       Anthropic  — "best combination of speed and intelligence".
#   ✔ claude-opus-5         Anthropic  — "complex agentic coding and enterprise work".
#   ✔ gpt-5.6-terra         OpenAI     — "balances intelligence and cost".
#   ✔ gpt-6-astra           OpenAI     — flagship, razonamiento y coding complejos.
#   ✔ gemini-3.8-flash      Google     — "most intelligent Flash model" (stable).
#   ✘ deepseek-v4-flash     RETIRADO  — se acepta por compatibilidad, lo sirve V4.1-Flash.
#   ✘ gpt-5-mini            NO EXISTE — la línea se sustituyó por gpt-5.6-luna.
#   ✘ gpt-5.3-codex         NO EXISTE.
#   ✘ claude-sonnet-4-20250514  NO EXISTE — fuera del catálogo actual.
#
# `sync-adapters.sh` traduce esto a:
#   .claude/settings.json      -> availableModels (allowlist)
#   .gemini/config.yaml        -> tiers / modelo por subagente
#   .codex/config.toml         -> model + model_reasoning_effort
#   .github/agents/*.agent.md  -> agentes para GitHub Copilot en VS Code
#   .env.harness               -> variables para orquestadores propios (CAO, etc.)
# ---------------------------------------------------------------------------

version: "1.1.0"

defaults:
  reasoning: "medium"
  temperature: 0.2
  max_output_tokens: 8192
  timeout_seconds: 300

# Proveedor operativo actualmente. Solo DeepSeek tiene credencial configurada,
# así que todos los roles apuntan ahí. Los `fallback` usan modelos de otros
# proveedores: cambiar de proveedor es editar una línea cuando exista la clave.
active_provider: "deepseek"

roles:
  # --- Init / Scope -------------------------------------------------------
  # Convertir un prompt vago en alcance medible exige matiz, no velocidad.
  sdd-init:
    model: "deepseek-v4-pro"
    provider: "deepseek"
    reasoning: "high"
    temperature: 0.2
    rationale: "Convertir ambigüedad en criterios medibles exige razonamiento, no latencia."
    fallback: ["claude-sonnet-5", "gpt-5.6-terra"]

  # --- Design / Tasks -----------------------------------------------------
  # Diseño y descomposición: contexto largo y razonamiento estructural.
  sdd-tech-lead:
    model: "deepseek-v4-pro"
    provider: "deepseek"
    reasoning: "high"
    temperature: 0.3
    rationale: "Diseño y descomposición sobre arquitectura existente; 1M de contexto."
    fallback: ["claude-sonnet-5", "gemini-3.8-flash"]

  # --- Implement ----------------------------------------------------------
  # Tareas atómicas y bien acotadas: coste y latencia son lo prioritario.
  sdd-developer:
    model: "deepseek-flash"
    provider: "deepseek"
    reasoning: "medium"
    temperature: 0.1
    rationale: "Una tarea = un commit, con el criterio ya escrito: no necesita razonamiento alto."
    fallback: ["deepseek-v4-pro", "gpt-5.6-luna"]

  # --- Verify -------------------------------------------------------------
  # Verificación independiente: máximo criterio del proveedor activo y temperatura 0.
  sdd-verifier:
    model: "deepseek-v4-pro"
    provider: "deepseek"
    reasoning: "high"
    temperature: 0.0
    rationale: "El veredicto debe ser reproducible; se usa el modelo más capaz disponible."
    fallback: ["gpt-6-astra", "claude-opus-5"]

  # --- Security review (opcional) -----------------------------------------
  # Análisis adversario del diff, con el mismo rigor que la verificación.
  sdd-security-reviewer:
    model: "deepseek-v4-pro"
    provider: "deepseek"
    reasoning: "high"
    temperature: 0.0
    rationale: "Análisis adversario: máximo criterio y temperatura 0."
    fallback: ["claude-opus-5", "gpt-6-astra"]

tiers:
  # Nivel 1 del harness: mínimo viable. Un modelo por rol, sin enrutamiento dinámico.
  level: 1
  optimization: "manual"   # manual | cost | latency | quality

# Modelos verificados por proveedor, para cambiar de rol sin consultar la web.
catalog:
  deepseek:
    - "deepseek-flash"      # barato y rápido; 1M ctx; tools + vision
    - "deepseek-v4-pro"     # razonamiento alto; 1M ctx; tools; sin vision
  anthropic:
    - "claude-sonnet-5"
    - "claude-opus-5"
    - "claude-fable-5-1"    # razonamiento exigente y trabajo agéntico largo
    - "claude-haiku-4-5"    # el más rápido y barato
  openai:
    - "gpt-6-astra"         # flagship
    - "gpt-5.6"             # alias de la línea 5.6
    - "gpt-5.6-terra"
    - "gpt-5.6-luna"        # optimizado para coste
  google:
    - "gemini-3.8-flash"    # el Flash más capaz (stable)
    - "gemini-3.7-flash"

