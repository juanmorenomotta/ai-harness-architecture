# .harness/routing.yaml
# ---------------------------------------------------------------------------
# Reglas de enrutamiento: qué hacer cuando el modelo preferido no está disponible.
# En Nivel 1 son deliberadamente simples (estáticas). El enrutamiento dinámico
# por coste/latencia es Nivel 2-3 y NO se activa todavía.
# ---------------------------------------------------------------------------

version: "1.0.0"

policy:
  mode: "static"          # static | cost-aware | latency-aware  (Nivel 1 = static)
  on_unavailable: "fallback"   # fallback | block | degrade
  on_quota_exceeded: "block"   # block | fallback
  on_balance_exhausted: "block"
  block_reason_template: >
    BLOQUEO: proveedor '{provider}' sin saldo/cuota para el rol '{role}' ({model}).
    Evidencia: {error}. Necesito: recargar crédito o cambiar el fallback en
    .harness/models.yaml, luego re-ejecutar scripts/sync-adapters.sh.

# Errores del proveedor que NO deben reintentarse (fallar rápido y escalar).
non_retryable_errors:
  - code: 401
    meaning: "Credencial inválida o revocada. Revisar la variable de entorno del proveedor."
  - code: 402
    meaning: "Saldo/cuota agotados. Es un problema de facturación, no del código."
  - code: 403
    meaning: "Permiso denegado para ese modelo o endpoint."
  - code: 404
    meaning: "Modelo inexistente o mal escrito. Revisar models.yaml."

retryable_errors:
  - code: 408
  - code: 429
  - code: 500
  - code: 502
  - code: 503

retry:
  max_attempts: 3
  backoff: "exponential"
  base_delay_seconds: 2
  jitter: true

# Alias que cada CLI espera en su propio vocabulario.
# sync-adapters.sh los usa para traducir models.yaml sin tocar los prompts.
# Catálogo verificado 2026-09-15.
aliases:
  copilot:
    # GitHub Copilot en VS Code — runtime real de este harness.
    # Traduce el `id` de models.yaml al nombre EXACTO que acepta el frontmatter.
    #
    # Hay dos procedencias y ambas usan el formato "<name> (<vendor>)":
    #   - nativo    -> vendor = Anthropic, OpenAI, Google, xAI, Moonshot, Microsoft
    #   - extensión -> vendor declarado por la extensión, p. ej. "deepseek"
    #     (DenizhanDaklr.copilot-vscode-deepseek registra vendor "deepseek")
    model_map:
      claude-sonnet-5: "Claude Sonnet 5 (anthropic)"
      gpt-5.6-terra: "GPT-5.6 Terra (openai)"
      gpt-5.3-codex: "GPT-5.3-Codex (openai)"
      gpt-5.4: "GPT-5.4 (openai)"
      gpt-5.4-mini: "GPT-5.4 mini (openai)"
      gemini-3.8-flash: "Gemini 3.8 Flash (google)"
      claude-haiku-4.5: "Claude Haiku 4.5 (anthropic)"
      mai-code-1.1-flash: "MAI-Code-1.1-Flash (microsoft)"
      deepseek-v4-flash: "DeepSeek V4 Flash (deepseek)"

  claude-code:
    "claude-sonnet-5": "claude-sonnet-5"
    "claude-opus-5": "claude-opus-5"
    "claude-haiku-4-5": "claude-haiku-4-5"
    tier_map:
      high: "claude-opus-5"
      medium: "claude-sonnet-5"
      low: "claude-haiku-4-5"

  gemini:
    tier_map:
      high: "pro"
      medium: "flash"
      low: "flash"

  codex:
    "gpt-5.3-codex": "gpt-5.3-codex"
    "gpt-5.6-terra": "gpt-5.6-terra"
    reasoning_map:
      low: "low"
      medium: "medium"
      high: "high"

  generic-openai-compatible:
    passthrough: true   # el nombre del modelo se envía tal cual

# Restricciones de coste (solo informativo en Nivel 1; se aplican en Nivel 2).
budget:
  enabled: false
  max_usd_per_feature: null
  alert_on_percent: 80

# Restricciones de hardware para modelos locales.
hardware:
  local_model_requires_gpu: true
  min_vram_gb: 24
  notes:
    - "Si no hay GPU suficiente, enrutar sdd-developer al fallback en la nube."
