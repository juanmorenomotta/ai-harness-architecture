# .harness/providers.yaml
# ---------------------------------------------------------------------------
# Definición de proveedores. Todos se exponen como endpoints OpenAI-compatible,
# de modo que cualquier CLI/orquestador pueda consumirlos con un único adaptador.
#
# ---------------------------------------------------------------------------
# REGLA R9 (AGENTS.md): aquí solo se declara el NOMBRE de la variable de entorno
# que contiene la credencial. NUNCA el valor de la clave.
#
# URLs y catálogos verificados contra la documentación oficial el 2026-09-15.
# ---------------------------------------------------------------------------

version: "1.1.0"

providers:
  deepseek:
    # NOTA DE ALCANCE: en este harness DeepSeek NO se consume por la API directa,
    # sino a través de la extensión de GitHub Copilot
    # (DenizhanDaklr.copilot-vscode-deepseek), que se registra como
    # languageModelChatProviders y expone "DeepSeek V4 Flash".
    # Esta sección documenta la API por si un orquestador externo la llama
    # directamente; no es la ruta que usan los agentes de .github/agents/.
    type: "openai-compatible"
    base_url: "https://api.deepseek.com"
    anthropic_base_url: "https://api.deepseek.com/anthropic"
    api_key_env: "DEEPSEEK_API_KEY"   # en VS Code la clave vive en la extensión
    models:
      - "deepseek-v4-flash"
      - "deepseek-v4-pro"
    supports:
      - tools
      - streaming
    limits:
      context_window: 1000000
    notes:
      - "ESTADO: operativo y con saldo. El 402 'Insufficient Balance' ya NO ocurre."
      - "Tool calling verificado: el agente ejecuta herramientas con este modelo."
      - "Si en el futuro reaparece un 402, es facturación, NO un fallo del prompt."
      - "Verificar saldo en https://platform.deepseek.com/usage."

  anthropic:
    type: "openai-compatible"
    base_url: "https://api.anthropic.com/v1"
    api_key_env: "ANTHROPIC_API_KEY"
    models:
      - "claude-sonnet-5"
      - "claude-opus-5"
    supports:
      - tools
      - streaming
      - vision
    notes:
      - "Nombres de la API. En Copilot el selector los llama '<Modelo> (<vendor>)'."
      - "En Copilot: Claude Sonnet 5, Claude Haiku 4.5."

  openai:
    type: "openai-compatible"
    base_url: "https://api.openai.com/v1"
    api_key_env: "OPENAI_API_KEY"
    models:
      - "gpt-5.6"
      - "gpt-5.6-terra"
      - "gpt-5.6-luna"
    supports:
      - tools
      - streaming
      - reasoning_effort
    notes:
      - "En Copilot: GPT-5.6 Terra, GPT-5.3-Codex, GPT-5.4, GPT-5.4 mini."
      - "'gpt-5.3-codex' existe en Copilot pero NO en la API de OpenAI: son catálogos distintos."

  google:
    type: "openai-compatible"
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    api_key_env: "GOOGLE_API_KEY"
    models:
      - "gemini-3.8-flash"
    supports:
      - tools
      - streaming
      - vision
    notes:
      - "En Copilot: Gemini 3.5/3.6/3.7/3.8 Flash."

  local:
    type: "openai-compatible"
    base_url: "http://localhost:8000/v1"
    api_key_env: "VLLM_API_KEY"   # opcional según el servidor
    models: []                     # se descubre en /v1/models
    supports:
      - tools
      - streaming
    notes:
      - "vLLM / Ollama / LM Studio expuestos como OpenAI-compatible."
      - "Usar SOLO para tareas atómicas; el Verifier no debe usar modelos locales en Nivel 1."
      - "Requiere GPU: ver restricciones de hardware en routing.yaml."

# Orden de preferencia cuando un rol tiene varios proveedores disponibles.
preference_order:
  - deepseek
  - anthropic
  - openai
  - google
  - local

