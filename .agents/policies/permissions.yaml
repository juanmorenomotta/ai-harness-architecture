# .agents/policies/permissions.yaml
# ---------------------------------------------------------------------------
# Política de permisos deny-first del harness.
# Principio: lo que no está explícitamente permitido, está prohibido.
# Consumido por: agentes de rol (ver `tools:` en cada .md), adaptadores de CLI
# y cualquier orquestador propio que lea esta política.
#
# ADR-022 — ANCLAJE DE RUTAS (leer antes de editar):
#   Los agentes se ejecutan DESDE el harness con la RAIZ DEL WORKSPACE como cwd.
#   - Roles SDD (init, tech-lead, developer, verifier): rutas relativas a la
#     RAIZ DEL WORKSPACE, prefijadas por componente (backend/, frontend/,
#     ai-harness-architecture/). Agregar un componente nuevo = agregar sus
#     rutas aqui, por PR HUMANA (fragmentos por stack en templates/permissions/).
#   - harness-maintainer: rutas relativas a la RAIZ DEL HARNESS, sin prefijo
#     (mantiene el molde, no los componentes; el validador las exige exactas).
# ---------------------------------------------------------------------------

version: "1.1.0"
policy_model: "deny-first"

# ---------------------------------------------------------------------------
# Permisos por rol. `allow` es la lista blanca de tools del subagente.
# ---------------------------------------------------------------------------
roles:

  sdd-init:
    allow:
      - read
      - edit             # escribe SU artefacto: <componente>/.spec/**/scope.md
      - search
      - todo
    # `writable_paths` es el control real: `edit` es la tool, la ruta la limita la lista.
    # Rutas relativas a la RAIZ DEL WORKSPACE (ADR-022).
    writable_paths:
      - "backend/.spec/**/scope.md"
      - "frontend/.spec/**/scope.md"
      - "ai-harness-architecture/.spec/**/scope.md"   # features del propio harness

  sdd-tech-lead:
    allow:
      - read
      - edit
      - search
      - todo
    writable_paths:
      - "backend/.spec/**/design.md"
      - "backend/.spec/**/tasks/**"
      - "backend/.spec/**/ADR/**"
      - "frontend/.spec/**/design.md"
      - "frontend/.spec/**/tasks/**"
      - "frontend/.spec/**/ADR/**"
      - "ai-harness-architecture/.spec/**/design.md"
      - "ai-harness-architecture/.spec/**/tasks/**"
      - "ai-harness-architecture/.spec/**/ADR/**"

  sdd-developer:
    allow:
      - read
      - edit
      - search
      - execute
      - todo
    deny:
      - web
      - agent
    writable_paths:
      # --- Componente backend (Laravel) ---
      - "backend/app/**"
      - "backend/routes/**"
      - "backend/database/**"
      - "backend/config/**"
      - "backend/resources/**"
      - "backend/public/**"
      - "backend/bootstrap/**"
      - "backend/tests/**"
      # --- Componente frontend (Vue 3 + Vite) ---
      - "frontend/src/**"
      - "frontend/public/**"
      - "frontend/tests/**"
    # Rutas que NUNCA puede escribir, aunque estén bajo writable_paths.
    protected_paths:
      - "**/AGENTS.md"
      - "**/harness.config.json"
      - "**/init.sh"
      - "**/.harness/**"
      - "**/.agents/**"
      - "**/.github/workflows/**"
      - "**/.spec/**/verify.md"

  sdd-verifier:
    allow:
      - read
      - edit             # escribe SU artefacto: <componente>/.spec/**/verify.md
      - search
      - execute          # necesita correr init.sh del componente y los tests
      - todo
    deny:
      - agent
    writable_paths:
      - "backend/.spec/**/verify.md"
      - "frontend/.spec/**/verify.md"
      - "ai-harness-architecture/.spec/**/verify.md"
    notes:
      - "`edit` existe SOLO para escribir verify.md: el resto de rutas las bloquea writable_paths."
      - "El Verifier NO edita código: si algo falla, escribe FAIL y devuelve la tarea."

  sdd-security-reviewer:
    allow:
      - read
      - search
      - web              # consultar CVEs/advisories
    deny:
      - edit
      - execute
    writable_paths: []   # reporta al Verifier; no escribe artefactos propios

  # Mantiene el harness (ADR-007). Es el UNICO rol con escritura sobre scripts/.harness/.agents.
  # Sus rutas son relativas a la RAIZ DEL HARNESS (sin prefijo de workspace): el validador
  # las exige exactas (ADR-022).
  harness-maintainer:
    allow:
      - read
      - edit
      - search
      - execute
      - todo
    deny:
      - web
      - agent
    writable_paths:
      - "scripts/**"
      - ".harness/**"
      - ".agents/**"
      - "init.sh"
      - "harness.config.json"
    # Escritura limitada por `writable_paths`; `protected_paths` es la lista que NUNCA toca.
    protected_paths:
      - "AGENTS.md"
      - ".github/workflows/**"
    notes:
      - "Opera fuera del ciclo SDD: sin tasks/, revision humana obligatoria de su diff."
      - "Nunca se invoca para ajustar el harness tras un gate fallido de una feature (R4, R6, R7)."
      - "init.sh y harness.config.json SI son escribibles (2026-10-04), pero el validador comprueba
        que init.sh conserve sus checks obligatorios: el permiso no permite vaciar el gate (ADR-017)."

# ---------------------------------------------------------------------------
# Denegaciones globales: aplican a TODOS los roles, sin excepción.
# ---------------------------------------------------------------------------
global_deny:

  commands:
    - pattern: "git push --force*"
      reason: "Reescribe historia compartida."
    - pattern: "git push -f*"
      reason: "Reescribe historia compartida."
    - pattern: "git reset --hard*"
      reason: "Pierde trabajo no commiteado."
    - pattern: "git clean -fdx*"
      reason: "Borra archivos no rastreados."
    - pattern: "git branch -D*"
      reason: "Borrado forzado de rama."
    - pattern: "git tag -d*"
      reason: "Borrado de tag/release."
    - pattern: "sudo *"
      reason: "Escalada de privilegios."
    - pattern: "rm -rf /*"
      reason: "Borrado destructivo fuera del workspace."
    - pattern: "chmod 777*"
      reason: "Permisos inseguros."
    - pattern: "curl * | sh"
      reason: "Ejecución de código remoto sin verificación."
    - pattern: "wget * | sh"
      reason: "Ejecución de código remoto sin verificación."
    - pattern: "npm install -g*"
      reason: "Dependencia global altera el entorno del sistema."
    - pattern: "pip install --user*"
      reason: "Instalación fuera del entorno virtual del proyecto."
    - pattern: "* --no-verify*"
      reason: "Salta hooks de verificación (viola R6)."
    - pattern: "export *KEY=*"
      reason: "Riesgo de filtrado de credenciales en logs (R9)."

  paths:
    - pattern: "AGENTS.md"
      reason: "R4: la ley solo cambia por PR humano explícito."
    - pattern: "**/AGENTS.md"
      reason: "ADR-022: la ley GENERADA de cada componente tampoco la toca un agente; se regenera re-instanciando."
    - pattern: ".harness/**"
      reason: "R4: configuración del harness protegida."
      except_roles: [harness-maintainer]
    - pattern: ".agents/**"
      reason: "R4: definición de roles protegida."
      except_roles: [harness-maintainer]
    - pattern: ".github/workflows/**"
      reason: "Cambiar CI desde una tarea es un vector de bypass del gate."
    - pattern: ".git/**"
      reason: "Corrupción del repositorio."
    - pattern: "**/.env"
      reason: "R9: no se tocan archivos de secretos."
    - pattern: "**/*.pem"
      reason: "R9: material criptográfico."
    - pattern: "**/id_rsa*"
      reason: "R9: claves privadas."

# ---------------------------------------------------------------------------
# Escalado: cuando una acción está denegada, el agente NO improvisa.
# ---------------------------------------------------------------------------
on_denied:
  action: "block_and_escalate"
  message_template: >
    BLOQUEO: acción denegada por política ({rule}).
    Evidencia: {evidence}. Necesito: aprobación humana explícita (ver AGENTS.md §7).

# Rutas de escalado humano (gates LGTM)
escalation:
  gates:
    G1: { from: "scope.md",    to: "design.md",      approver: "product-owner" }
    G2: { from: "design.md",   to: "implementation", approver: "tech-lead" }
    G3: { from: "verify.md",   to: "merge",          approver: "reviewer" }
  rule: "Un agente nunca aprueba su propio gate."
