# .agents/policies/permissions.yaml
# ---------------------------------------------------------------------------
# Política de permisos deny-first del harness.
# Principio: lo que no está explícitamente permitido, está prohibido.
# Consumido por: agentes de rol (ver `tools:` en cada .md), adaptadores de CLI
# y cualquier orquestador propio que lea esta política.
# ---------------------------------------------------------------------------

version: "1.0.0"
policy_model: "deny-first"

# ---------------------------------------------------------------------------
# Permisos por rol. `allow` es la lista blanca de tools del subagente.
# ---------------------------------------------------------------------------
roles:

  sdd-init:
    allow:
      - read
      - edit             # escribe SU artefacto: .spec/**/scope.md (writable_paths)
      - search
      - todo
    # `writable_paths` es el control real: `edit` es la tool, la ruta la limita la lista.
    writable_paths:
      - ".spec/**/scope.md"

  sdd-tech-lead:
    allow:
      - read
      - edit
      - search
      - todo
    writable_paths:
      - ".spec/**/design.md"
      - ".spec/**/tasks/**"
      - ".spec/**/ADR/**"

  sdd-developer:
    allow:
      - read
      - edit
      - search
      - execute
      - todo
    deny:
      - web
      - agent
    writable_paths:
      - "src/**"
      - "tests/**"
      - "lib/**"
      - "app/**"
    # Rutas que NUNCA puede escribir, aunque estén bajo writable_paths.
    protected_paths:
      - "AGENTS.md"
      - "harness.config.json"
      - "init.sh"
      - ".harness/**"
      - ".agents/**"
      - ".github/workflows/**"
      - ".spec/**/verify.md"

  sdd-verifier:
    allow:
      - read
      - edit             # escribe SU artefacto: .spec/**/verify.md (writable_paths)
      - search
      - execute          # necesita correr ./init.sh y los tests
      - todo
    deny:
      - agent
    writable_paths:
      - ".spec/**/verify.md"
    notes:
      - "`edit` existe SOLO para escribir verify.md: el resto de rutas las bloquea writable_paths."
      - "El Verifier NO edita código: si algo falla, escribe FAIL y devuelve la tarea."

  sdd-security-reviewer:
    allow:
      - read
      - search
      - web              # consultar CVEs/advisories
    deny:
      - edit
      - execute
    writable_paths: []   # reporta al Verifier; no escribe artefactos propios

  # Mantiene el harness (ADR-007). Es el UNICO rol con escritura sobre scripts/.harness/.agents.
  harness-maintainer:
    allow:
      - read
      - edit
      - search
      - execute
      - todo
    deny:
      - web
      - agent
    writable_paths:
      - "scripts/**"
      - ".harness/**"
      - ".agents/**"
    protected_paths:
      - "AGENTS.md"
      - ".github/workflows/**"
      - "init.sh"
      - "harness.config.json"
    notes:
      - "Opera fuera del ciclo SDD: sin tasks/, revision humana obligatoria de su diff."
      - "Nunca se invoca para ajustar el harness tras un gate fallido de una feature (R4, R6, R7)."

# ---------------------------------------------------------------------------
# Denegaciones globales: aplican a TODOS los roles, sin excepción.
# ---------------------------------------------------------------------------
global_deny:

  commands:
    - pattern: "git push --force*"
      reason: "Reescribe historia compartida."
    - pattern: "git push -f*"
      reason: "Reescribe historia compartida."
    - pattern: "git reset --hard*"
      reason: "Pierde trabajo no commiteado."
    - pattern: "git clean -fdx*"
      reason: "Borra archivos no rastreados."
    - pattern: "git branch -D*"
      reason: "Borrado forzado de rama."
    - pattern: "git tag -d*"
      reason: "Borrado de tag/release."
    - pattern: "sudo *"
      reason: "Escalada de privilegios."
    - pattern: "rm -rf /*"
      reason: "Borrado destructivo fuera del workspace."
    - pattern: "chmod 777*"
      reason: "Permisos inseguros."
    - pattern: "curl * | sh"
      reason: "Ejecución de código remoto sin verificación."
    - pattern: "wget * | sh"
      reason: "Ejecución de código remoto sin verificación."
    - pattern: "npm install -g*"
      reason: "Dependencia global altera el entorno del sistema."
    - pattern: "pip install --user*"
      reason: "Instalación fuera del entorno virtual del proyecto."
    - pattern: "* --no-verify*"
      reason: "Salta hooks de verificación (viola R6)."
    - pattern: "export *KEY=*"
      reason: "Riesgo de filtrado de credenciales en logs (R9)."

  paths:
    - pattern: "AGENTS.md"
      reason: "R4: la ley solo cambia por PR humano explícito."
    - pattern: ".harness/**"
      reason: "R4: configuración del harness protegida."
      except_roles: [harness-maintainer]
    - pattern: ".agents/**"
      reason: "R4: definición de roles protegida."
      except_roles: [harness-maintainer]
    - pattern: ".github/workflows/**"
      reason: "Cambiar CI desde una tarea es un vector de bypass del gate."
    - pattern: ".git/**"
      reason: "Corrupción del repositorio."
    - pattern: "**/.env"
      reason: "R9: no se tocan archivos de secretos."
    - pattern: "**/*.pem"
      reason: "R9: material criptográfico."
    - pattern: "**/id_rsa*"
      reason: "R9: claves privadas."

# ---------------------------------------------------------------------------
# Escalado: cuando una acción está denegada, el agente NO improvisa.
# ---------------------------------------------------------------------------
on_denied:
  action: "block_and_escalate"
  message_template: >
    BLOQUEO: acción denegada por política ({rule}).
    Evidencia: {evidence}. Necesito: aprobación humana explícita (ver AGENTS.md §7).

# Rutas de escalado humano (gates LGTM)
escalation:
  gates:
    G1: { from: "scope.md",    to: "design.md",      approver: "product-owner" }
    G2: { from: "design.md",   to: "implementation", approver: "tech-lead" }
    G3: { from: "verify.md",   to: "merge",          approver: "reviewer" }
  rule: "Un agente nunca aprueba su propio gate."
